[project]
name = "jobflow-ai"
version = "0.1.0"
description = "AI-powered automated job application tool and dynamic ATS CV generator with Docker support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "playwright>=1.42.0",
    "jinja2>=3.1.3",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "litellm>=1.30.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
jobflow = "jobflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
