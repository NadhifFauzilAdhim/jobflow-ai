<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JobFlow AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-500/20 selection:text-emerald-300">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center -z-10 overflow-hidden">
    <div class="w-[500px] h-[500px] bg-emerald-500/5 rounded-full blur-3xl"></div>
    <div class="w-[400px] h-[400px] bg-zinc-700/10 rounded-full blur-3xl -mt-40"></div>
  </div>

  <!-- Top Minimal Nav -->
  <header class="p-6 flex justify-between items-center max-w-6xl w-full mx-auto">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-zinc-100 text-zinc-950 flex items-center justify-center font-bold text-sm shadow-md">
        JF
      </div>
      <div>
        <span class="font-semibold text-sm tracking-tight text-zinc-100">JobFlow AI</span>
        <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700/50 ml-1.5">v0.1</span>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs text-zinc-400">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-mono text-[11px]">System Online</span>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-zinc-900/80 border border-zinc-800 backdrop-blur-xl rounded-2xl p-7 sm:p-8 shadow-2xl relative">

      <!-- Header Icon & Title -->
      <div class="flex flex-col items-center text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-zinc-800/80 border border-zinc-700/60 flex items-center justify-center text-emerald-400 mb-3 shadow-inner">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-bold text-zinc-100 tracking-tight">Protected Portal</h2>
        <p class="text-xs text-zinc-400 mt-1.5 max-w-xs">
          Enter your authorized credentials to manage autonomous job applications and tailored CVs.
        </p>
      </div>

      <!-- Error Alert (Hidden by default) -->
      <div id="errorAlert" class="hidden mb-5 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-center gap-2">
        <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span id="errorMessage">Invalid credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-medium text-zinc-300 mb-1.5">Username</label>
          <div class="relative">
            <input 
              type="text" 
              id="username" 
              name="username" 
              required 
              autocomplete="username"
              placeholder="e.g. admin" 
              class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition font-mono"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-medium text-zinc-300">Password</label>
          </div>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••" 
              class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition font-mono"
            >
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-zinc-400 hover:text-zinc-300">
            <input type="checkbox" id="rememberMe" checked class="rounded bg-zinc-950 border-zinc-800 text-emerald-500 focus:ring-emerald-500/20 w-3.5 h-3.5">
            <span>Remember session (7 days)</span>
          </label>
        </div>

        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full mt-2 py-2.5 px-4 rounded-lg bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-white/5 active:scale-[0.99]"
        >
          <span id="btnText">Sign In to Dashboard</span>
          <span id="btnSpinner" class="hidden">
            <svg class="animate-spin h-3.5 w-3.5 text-zinc-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
        </button>
      </form>

      <!-- Security Notice Footer Inside Card -->
      <div class="mt-6 pt-4 border-t border-zinc-800/80 text-center">
        <p class="text-[11px] text-zinc-500 flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
          <span>End-to-End Encrypted Session & Local DB Storage</span>
        </p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 text-center text-xs text-zinc-600">
    JobFlow AI — Autonomous ATS CV Generator & Application Engine
  </footer>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerText = "Authenticating...";
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput,
            remember_me: rememberMe
          })
        });

        const data = await res.json();

        if (res.ok) {
          btnText.innerText = "Success! Redirecting...";
          
          // Get next url from query params if present
          const urlParams = new URLSearchParams(window.location.search);
          const nextUrl = urlParams.get('next') || '/';
          window.location.href = nextUrl;
        } else {
          errorAlert.classList.remove('hidden');
          errorMessage.innerText = data.detail || 'Invalid username or password.';
          submitBtn.disabled = false;
          btnText.innerText = "Sign In to Dashboard";
          btnSpinner.classList.add('hidden');
        }
      } catch (err) {
        errorAlert.classList.remove('hidden');
        errorMessage.innerText = "Network or server error. Please try again.";
        submitBtn.disabled = false;
        btnText.innerText = "Sign In to Dashboard";
        btnSpinner.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
